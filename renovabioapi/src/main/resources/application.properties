#BANCO
spring.datasource.url=jdbc:mysql://localhost:3306/bdrenovabio?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=bruna123


# JPA
# update - faz com que o Spring crie ou atualize as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
#executa automaticamente arquivos SQL na inicialização do aplicativo
spring.sql.init.mode=never
# mostrar no terminal os comandos sql que o java ta executando
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# SERVIDOR - PORTA
server.port=8080

# UPLOAD
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# EMAIL
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
renovabio.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# TOKEN SIMPLES PARA O APP
renovabio.jwt.secret=renovabio-dev-secret-local
renovabio.jwt.expiration-hours=72

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
